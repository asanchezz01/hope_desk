# Servidor do app Web exportado pelo Expo.
#
# Fica atrás do nginx-proxy-manager, que termina o TLS. Este aqui só entrega
# arquivo estático — não fala com a API, que tem subdomínio próprio.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O proxy da frente é quem sabe o IP real do cliente.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.16.0.0/12;

    # `$uri.html` antes do fallback: a exportação estática do expo-router gera
    # um HTML por rota (`login.html`, `analytics.html`). Sem essa linha, toda
    # rota cairia no index e a navegação direta por URL perderia a página certa.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Assets com hash no nome podem ser cacheados para sempre; o HTML, nunca —
    # senão o navegador continua servindo a versão anterior depois do deploy.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cabeçalhos de segurança. A API tem os seus (helmet); estes são do HTML.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Não vaza a versão do nginx em página de erro.
    server_tokens off;
}
