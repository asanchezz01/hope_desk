# Deploy em produção (VPS).
#
# Dispara a cada push em `main` — e SÓ depois de as validações rápidas do CI
# passarem. Os testes de integração continuam no CI normal do mesmo push, mas
# não bloqueiam este fluxo de deploy.
#
# `workflow_dispatch` fica disponível para repetir um deploy sem novo commit
# (por exemplo, depois de mexer no `.env` da VPS) e para publicar a partir de
# outro branch: o deploy usa `github.ref_name`, ou seja, o branch de onde o
# disparo partiu. Assim dá para validar na VPS antes de mexer em `main`.
#
# ## Por que runner self-hosted, e não SSH
#
# A primeira versão entrava por SSH com `appleboy/ssh-action`. Não funciona
# nesta máquina: o firewall do provedor (fora da VM — dentro dela o `ufw` já
# liberava) descarta a porta 22 para quem não é o IP do escritório. O runner do
# GitHub morria em `dial tcp ***:22: i/o timeout`, e o `auth.log` da VPS não
# registrava tentativa alguma: os pacotes nunca chegavam.
#
# O runner self-hosted inverte o sentido da conexão — ele SAI da VPS para o
# GitHub, por 443. Nenhuma porta a abrir, nenhuma senha de root no CI.
#
# Preço, que precisa ser pago junto: repositório público com runner
# self-hosted permitiria a um PR de fork executar código na máquina. Por isso a
# política de aprovação está em `all_external_contributors` — nenhum workflow
# de fora roda sem aprovação humana. Se essa política for afrouxada, este
# runner vira um problema de segurança, não uma conveniência.
#
# Nenhum segredo da aplicação passa por aqui: a senha do banco e os segredos
# JWT são gerados NA VPS pelo `remote-deploy.sh` e ficam só no `.env` de lá.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez. `cancel-in-progress: false` de propósito: interromper um
# deploy no meio deixa a stack em estado indefinido.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      skip_integration_tests: true

  deploy:
    name: Publicar na VPS
    needs: ci
    # O runner instalado em /opt/actions-runner, como serviço, usuário `gha`.
    runs-on: [self-hosted, hopedesk-vps]
    timeout-minutes: 20
    environment:
      name: producao
      url: https://hopedesk.hopecash.tech

    steps:
      - name: Publicar
        # Roda na própria VPS. O `_work` do runner não é a stack: o alvo é
        # sempre /opt/hopedesk, que é o que o compose e o `.env` conhecem.
        run: |
          set -e
          REPO_DIR=/opt/hopedesk
          BRANCH='${{ github.ref_name }}'
          REPO_URL='https://github.com/${{ github.repository }}.git'

          # Bootstrap: se o diretório não existir (máquina nova, ou alguém o
          # apagou), clona. O repositório é público — sem credencial de git na
          # VPS para vazar ou expirar.
          if [ ! -d "$REPO_DIR/.git" ]; then
            echo "[bootstrap] clonando $REPO_URL em $REPO_DIR"
            git clone "$REPO_URL" "$REPO_DIR"
          fi

          cd "$REPO_DIR"
          git remote set-url origin "$REPO_URL"
          # O script vem do próprio repositório e é atualizado pelo git no
          # primeiro passo dele mesmo — por isso o fetch acontece aqui antes.
          git fetch --prune origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          chmod +x scripts/deploy/remote-deploy.sh
          REPO_DIR="$REPO_DIR" BRANCH="$BRANCH" ./scripts/deploy/remote-deploy.sh

  verificar:
    name: Verificar o endereço público
    needs: deploy
    # De propósito num runner do GitHub, e não na VPS: conferir do lado de
    # dentro provaria só que o container responde — o que o passo anterior já
    # fez. O que falta provar é o caminho de fora: DNS, proxy e certificado.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Conferir API e app Web
        run: |
          echo "== API =="
          curl -fsS --max-time 20 https://hopedesk-api.hopecash.tech/api/v1/health || {
            echo "A API não respondeu pelo endereço público."
            echo "A stack pode estar de pé mesmo assim: o job anterior já a"
            echo "conferiu por dentro. O que falta é o caminho até ela."
            echo "Confira, nesta ordem (ver docs/DEPLOY.md §4):"
            echo "  1. registro DNS de hopedesk-api.hopecash.tech apontando para a VPS;"
            echo "  2. proxy host no nginx-proxy-manager: hopedesk-api -> hopedesk-api:3000;"
            echo "  3. certificado emitido para o domínio."
            exit 1
          }
          echo
          echo "== App Web =="
          curl -fsS --max-time 20 -o /dev/null -w "HTTP %{http_code}\n" https://hopedesk.hopecash.tech/
