{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Alterar senha</h1>
        {% if forced %}
        <div class="alert alert-warning">
          Por segurança, você precisa definir uma nova senha antes de continuar usando o sistema.
        </div>
        {% endif %}
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Senha atual</label>
            <input class="form-control" type="password" name="current_password" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Nova senha</label>
            <input class="form-control" type="password" name="password" minlength="6" required>
            <div class="form-text">Mínimo de 6 caracteres.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirmar nova senha</label>
            <input class="form-control" type="password" name="password_confirmation" minlength="6" required>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Salvar nova senha</button>
            {% if not forced %}
            <a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Cancelar</a>
            {% endif %}
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
