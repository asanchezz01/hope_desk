{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Esqueci minha senha</h1>
        <p class="text-muted">Informe o e-mail cadastrado e enviaremos um link para você definir uma nova senha.</p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input class="form-control" type="email" name="email" required autofocus>
          </div>
          <button class="btn btn-primary w-100" type="submit">Enviar link de troca de senha</button>
        </form>
        <div class="text-center mt-3">
          <a href="{{ url_for('login') }}">Voltar para o login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
