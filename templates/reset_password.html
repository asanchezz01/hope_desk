{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Definir nova senha</h1>
        <p class="text-muted">Defina uma nova senha para <strong>{{ user_email }}</strong>.</p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Nova senha</label>
            <input class="form-control" type="password" name="password" minlength="6" required autofocus>
            <div class="form-text">Mínimo de 6 caracteres.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirmar nova senha</label>
            <input class="form-control" type="password" name="password_confirmation" minlength="6" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Salvar nova senha</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
